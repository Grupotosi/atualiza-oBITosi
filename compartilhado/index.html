<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Dash Compras Tosi · Compartilhamento</title><link rel="stylesheet" href="./assets/styles.css"><link rel="stylesheet" href="./assets/signature.css"><link rel="stylesheet" href="./assets/deadline-interactive.css"><link rel="stylesheet" href="./assets/period-totals.css"><link rel="stylesheet" href="./assets/shared-view.css"></head><body>
<aside class="shared-sidebar"><div class="brand"><div class="mark">CT</div><div><b>COMPRAS</b><span>TOSI</span></div></div><nav aria-label="Abas"><button class="nav selected" data-tab="dashboard">Visão executiva</button><button class="nav" data-tab="requests">Solicitações de compras</button><button class="nav" data-tab="payments">Programação de pagamentos</button><button class="nav" data-tab="ai">IA Compras Tosi</button></nav><div class="signature"><span>Powered By:</span><b>André Dallagnol</b></div><div class="shared-badge">Somente visualização</div></aside><main><header class="shared-header"><div><p>GESTÃO DE SUPRIMENTOS</p><h1 id="pageTitle">Visão executiva</h1><small id="updated" role="status">Carregando base compartilhada…</small></div><strong>Somente visualização</strong></header><section class="filters" id="filters"><label>Ano de emissão<select id="year"><option value="all">Todos os anos</option></select></label><label>Mês de emissão<select id="month"><option value="all">Todos os meses</option></select></label><label>Filial<select id="branch"><option value="">Todas as filiais</option></select></label><label>Comprador<select id="buyer"><option value="">Todos os compradores</option></select></label><label>Grupo<select id="group"><option value="">Todos os grupos</option></select></label><label>Solicitação (SC)<input id="scSearch" placeholder="Número da solicitação"></label><label>Busca<input id="search" placeholder="Pedido, SC, fornecedor ou material"></label><label>Data inicial<input id="from" type="date"></label><label>Data final<input id="to" type="date"></label><label>Situação do título<select id="status"><option value="">Todos</option><option>Pago</option><option>Pendente</option></select></label><label>Entrega<select id="delivery"><option value="">Todas</option><option>Pendente</option><option>Entregue</option></select></label><button id="clear">Limpar filtros</button></section><div id="content" aria-live="polite"></div></main>

<footer>Consulta somente leitura · Sem alterações, envios de e-mail ou exportações.</footer>
