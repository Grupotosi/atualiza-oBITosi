<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Dash Compras Tosi · Compartilhamento</title><link rel="stylesheet" href="./assets/shared-view.css"></head><body>
<header><div><small>INDÚSTRIAS TOSI · COMPARTILHAMENTO</small><h1>Gestão de compras</h1><p id="updated">Carregando base compartilhada…</p></div><strong>Somente visualização</strong></header>
<nav aria-label="Abas"><button class="selected" data-tab="dashboard">Painel de compras</button><button data-tab="requests">Solicitações de compras</button><button data-tab="payments">Pagamentos</button><button data-tab="ai">IA de compras</button></nav>
<main><section class="filters" id="filters"><label>Mês de emissão<select id="month"><option value="all">Todos os meses</option></select></label><label>Filial<select id="branch"><option value="">Todas as filiais</option></select></label><label>Comprador<select id="buyer"><option value="">Todos os compradores</option></select></label><label>Grupo<select id="group"><option value="">Todos os grupos</option></select></label><label>Busca<input id="search" placeholder="Pedido, SC, fornecedor ou material"></label><label>Data inicial<input id="from" type="date"></label><label>Data final<input id="to" type="date"></label><label>Situação do título<select id="status"><option value="">Todos</option><option>Pago</option><option>Pendente</option></select></label><label>Entrega<select id="delivery"><option value="">Todas</option><option>Pendente</option><option>Entregue</option></select></label><button id="clear">Limpar filtros</button></section><div id="content" aria-live="polite"></div></main>
<aside class="floating"><button id="bell" aria-label="Pedidos em atraso">🔔 <span id="badge">0</span></button><button id="ask">Perguntar à IA</button></aside>
<dialog id="modal"><button id="close" aria-label="Fechar">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></dialog>
<footer>Consulta somente leitura · Sem alterações, envios de e-mail ou exportações.</footer>
<script src="./assets/purchase-rankings.js"></script><script src="./assets/shared-model.js"></script><script src="./assets/shared-view.js"></script></body></html>
